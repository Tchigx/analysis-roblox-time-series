name: Roblox Data Collector

on:
  schedule:
    # Every 15 minutes. GitHub does not honour this precisely -- runs are
    # commonly delayed 10-30 minutes and are dropped entirely under platform
    # load, especially on the hour. The collector timestamps each sample, so
    # treat the series as irregularly spaced in your analysis.
    - cron: '*/15 * * * *'
  workflow_dispatch:

# If a run overruns its slot, let the next one start rather than queueing up.
concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python collector.py
